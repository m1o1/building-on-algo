<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" role="img" aria-label="How the book's chapters depend on each other: Part I read in order, then concept and project chapters linked by solid arrows for hard prerequisites and dashed arrows for soft ones">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6172"/>
    </marker>
  </defs>
  <g font-family="DejaVu Sans, Verdana, sans-serif" fill="#2a2f3a">

    <!-- legend -->
    <rect x="30" y="22" width="26" height="16" rx="3" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
    <text x="64" y="35" font-size="13">concept chapter</text>
    <rect x="175" y="22" width="26" height="16" rx="3" fill="#e8eaef" stroke="#3d7dd8" stroke-width="2"/>
    <text x="209" y="35" font-size="13">project chapter</text>
    <line x1="325" y1="30" x2="360" y2="30" stroke="#5a6172" stroke-width="2" marker-end="url(#mN)"/>
    <text x="370" y="35" font-size="13">lost without it</text>
    <line x1="480" y1="30" x2="515" y2="30" stroke="#5a6172" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mN)"/>
    <text x="525" y="35" font-size="13">builds on it, but stands alone</text>

    <!-- Part I banner -->
