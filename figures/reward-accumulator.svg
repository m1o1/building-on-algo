<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" role="img" aria-label="Two stakers and one reward-per-token accumulator over four thousand rounds: the line climbs steeply while Alice stakes alone, flattens to a quarter of the slope when Bob's stake quadruples the total, and each staker's share is the current value minus their entry snapshot">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6172"/>
    </marker>
  </defs>
  <g font-family="DejaVu Sans, Verdana, sans-serif" fill="#2a2f3a">

    <!-- value guides -->
    <line x1="90" y1="196" x2="800" y2="196" stroke="#5a6172" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="90" y1="142" x2="800" y2="142" stroke="#5a6172" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="445" y1="410" x2="445" y2="196" stroke="#5a6172" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- the accumulator -->
    <polyline points="90,410 445,196 800,142" fill="none" stroke="#3d7dd8" stroke-width="2.5"/>
    <circle cx="90" cy="410" r="5.5" fill="#3d7dd8"/>
    <circle cx="445" cy="196" r="5.5" fill="#3d7dd8"/>
    <circle cx="800" cy="142" r="5" fill="#3d7dd8"/>

    <text x="100" y="394" font-size="12.5" fill="#5a6172">snapshot: 0</text>
    <text x="457" y="216" font-size="12.5" fill="#5a6172">snapshot: 200</text>

    <text x="240" y="352" font-size="13">slope = rate ÷ 100 — Alice alone</text>
    <text x="500" y="120" font-size="13">slope = rate ÷ 400 — four times the stake</text>
    <line x1="600" y1="128" x2="600" y2="166" stroke="#5a6172" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- shares -->
    <rect x="150" y="88" width="330" height="84" rx="8" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
    <text x="166" y="114" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#3d8a5f">Alice: 100 × (250 − 0)</text>
    <text x="166" y="136" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#3d8a5f">Bob:   300 × (250 − 200)</text>
    <text x="166" y="158" font-size="12.5" fill="#5a6172">share = stake × (now − snapshot)</text>

    <!-- axes -->
    <line x1="90" y1="410" x2="800" y2="410" stroke="#5a6172" stroke-width="1.5" marker-end="url(#mN)"/>
    <line x1="90" y1="410" x2="90" y2="80" stroke="#5a6172" stroke-width="1.5" marker-end="url(#mN)"/>
    <text x="98" y="72" font-size="13" fill="#5a6172">reward per token (scaled)</text>

    <text x="82" y="414" font-size="12.5" text-anchor="end" font-family="DejaVu Sans Mono, monospace">0</text>
    <text x="82" y="200" font-size="12.5" text-anchor="end" font-family="DejaVu Sans Mono, monospace">200</text>
    <text x="82" y="146" font-size="12.5" text-anchor="end" font-family="DejaVu Sans Mono, monospace">250</text>

    <text x="90" y="432" font-size="12.5" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text>
    <text x="445" y="432" font-size="12.5" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">2,000</text>
    <text x="800" y="432" font-size="12.5" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">4,000</text>
    <text x="800" y="450" font-size="12" text-anchor="middle" fill="#5a6172">(now)</text>

    <text x="70" y="452" font-size="13">Alice stakes 100 LP</text>
    <text x="445" y="452" font-size="13" text-anchor="middle">Bob stakes 300 LP</text>
    <text x="798" y="470" font-size="13" fill="#5a6172" text-anchor="end">rounds</text>
  </g>
</svg>
