<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="DejaVu Sans, sans-serif">
  <!-- The same twenty-four bytes, stored two ways, priced both times. The 2,500 µA
       is charged once per box and the 400 µA is charged per byte of the NAME as
       well as the value, so splitting one struct across three boxes pays for the
       account address three times over. The arithmetic is worked in full because
       readers do not believe the ratio until they have seen it add up. -->
  <style>
    text { fill: #111111; }
    .hd    { font-size: 13.5px; font-weight: bold; }
    .cell  { fill: #f2f2f2; stroke: #333333; stroke-width: 1.5; }
    .key   { fill: #e0e0e0; stroke: #333333; stroke-width: 1.5; }
    .alt   { fill: #ffffff; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .mono  { font-family: "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monos { font-family: "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .sub   { font-size: 11.5px; fill: #333333; }
    .tot   { font-size: 15px; font-weight: bold; }
    .rule  { stroke: #999999; stroke-width: 1; }
    .note  { font-size: 12.5px; }
    .panel { fill: #fafafa; stroke: #888888; stroke-width: 1; }
  </style>

  <!-- packed -->
  <text class="hd" x="30" y="38">One box per staker, holding one packed struct.</text>

  <rect class="key" x="30"  y="54" width="140" height="40"/>
  <text class="mono" x="100" y="79" text-anchor="middle">b"pos"</text>
  <rect class="key" x="178" y="54" width="380" height="40"/>
  <text class="mono" x="368" y="79" text-anchor="middle">the staker&#8217;s 32-byte address</text>
  <text class="sub" x="100" y="112" text-anchor="middle">3 B key prefix</text>
  <text class="sub" x="368" y="112" text-anchor="middle">32 B</text>
  <text class="sub" x="576" y="79">box name &#8212; 35 bytes</text>

  <rect class="cell" x="30"  y="140" width="260" height="40"/>
  <text class="mono" x="160" y="165" text-anchor="middle">amount</text>
  <rect class="cell" x="298" y="140" width="260" height="40"/>
  <text class="mono" x="428" y="165" text-anchor="middle">reward_debt</text>
  <rect class="cell" x="566" y="140" width="260" height="40"/>
  <text class="mono" x="696" y="165" text-anchor="middle">start_round</text>
  <text class="sub" x="160" y="198" text-anchor="middle">UInt64 &#183; 8 B</text>
  <text class="sub" x="428" y="198" text-anchor="middle">UInt64 &#183; 8 B</text>
  <text class="sub" x="696" y="198" text-anchor="middle">UInt64 &#183; 8 B</text>
  <text class="sub" x="30"  y="222">box value &#8212; 24 bytes</text>

  <text class="tot" x="30" y="256">2,500 &#43; 400 &#215; (35 &#43; 24)  =  26,100 µA</text>

  <line class="rule" x1="20" y1="280" x2="860" y2="280"/>

  <!-- split -->
  <text class="hd" x="30" y="312">The same three numbers in three boxes, one per field.</text>

  <rect class="alt" x="30"  y="326" width="230" height="34"/>
  <text class="monos" x="145" y="348" text-anchor="middle">b"amt" + address</text>
  <rect class="alt" x="268" y="326" width="90" height="34"/>
  <text class="monos" x="313" y="348" text-anchor="middle">8 B</text>
  <text class="note" x="380" y="348">2,500 &#43; 400 &#215; (35 &#43; 8)  =  19,700 µA</text>

  <rect class="alt" x="30"  y="368" width="230" height="34"/>
  <text class="monos" x="145" y="390" text-anchor="middle">b"dbt" + address</text>
  <rect class="alt" x="268" y="368" width="90" height="34"/>
  <text class="monos" x="313" y="390" text-anchor="middle">8 B</text>
  <text class="note" x="380" y="390">2,500 &#43; 400 &#215; (35 &#43; 8)  =  19,700 µA</text>

  <rect class="alt" x="30"  y="410" width="230" height="34"/>
  <text class="monos" x="145" y="432" text-anchor="middle">b"srt" + address</text>
  <rect class="alt" x="268" y="410" width="90" height="34"/>
  <text class="monos" x="313" y="432" text-anchor="middle">8 B</text>
  <text class="note" x="380" y="432">2,500 &#43; 400 &#215; (35 &#43; 8)  =  19,700 µA</text>

  <text class="tot" x="30" y="474">59,100 µA  &#8212;  2.26&#215; the packed layout, for exactly the same 24 bytes of data.</text>

  <!-- why -->
  <rect class="panel" x="20" y="500" width="840" height="120"/>
  <text class="note" x="36" y="526">The address is stored three times, and the flat 2,500 µA is charged three times. Neither of those buys</text>
  <text class="note" x="36" y="546">any storage &#8212; the payload is identical.</text>
  <text class="note" x="36" y="576">So: pack the fields that are read together into one box, and keep the key prefix short. Every character</text>
  <text class="note" x="36" y="596">of it is another 400 µA on every single box in the map, paid for as long as the box exists.</text>
</svg>
