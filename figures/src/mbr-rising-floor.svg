<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 814" width="700" height="814" font-family="DejaVu Sans, sans-serif">
  <!-- The guestbook's balance against its own minimum balance, drawn to scale. The
       balance is flat because nobody sends the contract money; the floor is a
       staircase because every signature adds 40 bytes of box at 400 microAlgos a byte.
       Both lines are real arithmetic: floor(n) = 100,000 + 2,500 + 400 x (7 + 40n) for
       n signatures in a box named b"entries". The two steps the story turns on are
       16,000 microAlgos apart, which at this scale is 5.44 pixels, hence the inset
       which magnifies the last step that fits and the first that does not.
       Every coordinate below comes out of that formula rather than off a ruler;
       regenerate them with /tmp/figgen/mbr.py if the window ever changes. -->
  <!-- THE CANVAS WIDTH IS A TYPE SIZE. The book scales every figure down to the
       470.4pt text width and never scales one up, so a drawing's on-page type is
       font_px x 0.75 x 470.4 / (0.75 x width_px), which reduces to
       font_px >= width_px / 58.8 for the house's 8pt floor. At the original 960px
       this figure's 11px inset labels landed at 5.39pt, the worst in the book, and
       960px was forced by nothing but the inset sitting BESIDE the main plot. Moving
       the inset below it is what let the canvas come in to 700px, where the floor
       needs 11.9px and the smallest type here is 12.5px. Scaling the whole
       drawing uniformly would change nothing at all, since the ratio is what the
       page sees.

       HEIGHT IS A SEPARATE CONSTRAINT, AND THE CAPTION HAS TO FIT UNDER IT. Past
       width x 619/470.4 = 921px the height binds instead of the width and every type
       size shrinks again, so a first redraw came in at 900px, deliberately just
       inside that ceiling. It overflowed the page anyway: 900px is 604.8pt on the
       page, 97.7% of the 619pt text block, leaving nothing for the two-to-three
       sentence caption that has to sit beneath the drawing. The caption's last line
       bottomed 15.6pt below every neighbouring page and cleared the folio by 3.4pt
       where the book's normal figure-to-folio gap is about 19pt. The 921px ceiling
       is real but it is not the working limit; budget about 60pt of page for the
       caption and hold the drawing near 545pt, which at 700px wide is 811px of
       canvas. This figure is 814px, or 547.0pt. The height came out of layout and
       not out of type, because 12.5px against a 700px canvas is only 0.6px above the
       floor: the inset panel lost its dead top margin and its vertical scale came
       down from 7.5 to 6.0 pixels per 1,000 microAlgos, which is 66px of the 86px
       saved. -->
  <style>
    text { fill: #111111; }
    .ax    { stroke: #333333; stroke-width: 1.5; fill: none; }
    .grid  { stroke: #dddddd; stroke-width: 1; }
    .floor { fill: none; stroke: #333333; stroke-width: 2; }
    .bal   { fill: none; stroke: #333333; stroke-width: 2; stroke-dasharray: 7 4; }
    .dead  { fill: #f2f2f2; stroke: none; }
    .lead  { fill: none; stroke: #666666; stroke-width: 1; stroke-dasharray: 3 3; }
    .ipanel{ fill: #fafafa; stroke: #888888; stroke-width: 1; }
    .tick  { font-size: 12.5px; fill: #333333; }
    .alab  { font-size: 13px; fill: #333333; }
    .top   { font-size: 15px; font-weight: bold; }
    .name  { font-size: 13.5px; font-weight: bold; }
    .amt   { font-size: 12.5px; fill: #333333; }
    .note  { font-size: 12.5px; fill: #333333; font-style: italic; }
    .ihead { font-size: 13px; font-weight: bold; }
    .ival  { font-size: 13px; font-weight: bold; }
    .ilab  { font-size: 12.5px; fill: #333333; }
    .dot   { fill: #111111; }
  </style>

  <text class="top" x="350" y="38" text-anchor="middle">One Algo, and a floor that rises 16,000 &#181;A per signature</text>

  <!-- Everything right of the crossing is unreachable, so it is greyed rather than
       annotated: the reader should see the region before reading about it. -->
  <rect class="dead" x="622.7" y="74.0" width="37.3" height="376.0"/>

  <line class="grid" x1="100.0" y1="450.0" x2="660.0" y2="450.0"/>
  <text class="tick" x="92.0" y="454.0" text-anchor="end">0</text>
  <line class="grid" x1="100.0" y1="382.0" x2="660.0" y2="382.0"/>
  <text class="tick" x="92.0" y="386.0" text-anchor="end">200,000</text>
  <line class="grid" x1="100.0" y1="314.0" x2="660.0" y2="314.0"/>
  <text class="tick" x="92.0" y="318.0" text-anchor="end">400,000</text>
  <line class="grid" x1="100.0" y1="246.0" x2="660.0" y2="246.0"/>
  <text class="tick" x="92.0" y="250.0" text-anchor="end">600,000</text>
  <line class="grid" x1="100.0" y1="178.0" x2="660.0" y2="178.0"/>
  <text class="tick" x="92.0" y="182.0" text-anchor="end">800,000</text>
  <line class="grid" x1="100.0" y1="110.0" x2="660.0" y2="110.0"/>
  <text class="tick" x="92.0" y="114.0" text-anchor="end">1,000,000</text>

  <path class="ax" d="M 100.0 74.0 L 100.0 450.0 L 660.0 450.0"/>
  <line class="ax" x1="100.0" y1="450.0" x2="100.0" y2="455.0"/>
  <text class="tick" x="100.0" y="472.0" text-anchor="middle">0</text>
  <line class="ax" x1="193.3" y1="450.0" x2="193.3" y2="455.0"/>
  <text class="tick" x="193.3" y="472.0" text-anchor="middle">10</text>
  <line class="ax" x1="286.7" y1="450.0" x2="286.7" y2="455.0"/>
  <text class="tick" x="286.7" y="472.0" text-anchor="middle">20</text>
  <line class="ax" x1="380.0" y1="450.0" x2="380.0" y2="455.0"/>
  <text class="tick" x="380.0" y="472.0" text-anchor="middle">30</text>
  <line class="ax" x1="473.3" y1="450.0" x2="473.3" y2="455.0"/>
  <text class="tick" x="473.3" y="472.0" text-anchor="middle">40</text>
  <line class="ax" x1="566.7" y1="450.0" x2="566.7" y2="455.0"/>
  <text class="tick" x="566.7" y="472.0" text-anchor="middle">50</text>
  <line class="ax" x1="660.0" y1="450.0" x2="660.0" y2="455.0"/>
  <text class="tick" x="660.0" y="472.0" text-anchor="middle">60</text>
  <text class="alab" x="380.0" y="498.0" text-anchor="middle">signatures written (<tspan font-style="italic">n</tspan>)</text>
  <text class="alab" x="92.0" y="60.0" text-anchor="end">&#181;A</text>

  <line class="bal" x1="100.0" y1="110.0" x2="660.0" y2="110.0"/>
  <text class="name" x="110.0" y="100.0">Balance &#8212; 1,000,000 &#181;A, flat</text>
  <text class="amt" x="110.0" y="132.0">Nobody sends the contract money. Nothing here ever moves.</text>

  <path class="floor" d="M 100.0 416.0 L 109.3 416.0 L 109.3 408.8 L 118.7 408.8 L 118.7 403.3 L 128.0 403.3 L 128.0 397.9 L 137.3 397.9 L 137.3 392.4 L 146.7 392.4 L 146.7 387.0 L 156.0 387.0 L 156.0 381.6 L 165.3 381.6 L 165.3 376.1 L 174.7 376.1 L 174.7 370.7 L 184.0 370.7 L 184.0 365.2 L 193.3 365.2 L 193.3 359.8 L 202.7 359.8 L 202.7 354.4 L 212.0 354.4 L 212.0 348.9 L 221.3 348.9 L 221.3 343.5 L 230.7 343.5 L 230.7 338.0 L 240.0 338.0 L 240.0 332.6 L 249.3 332.6 L 249.3 327.2 L 258.7 327.2 L 258.7 321.7 L 268.0 321.7 L 268.0 316.3 L 277.3 316.3 L 277.3 310.8 L 286.7 310.8 L 286.7 305.4 L 296.0 305.4 L 296.0 300.0 L 305.3 300.0 L 305.3 294.5 L 314.7 294.5 L 314.7 289.1 L 324.0 289.1 L 324.0 283.6 L 333.3 283.6 L 333.3 278.2 L 342.7 278.2 L 342.7 272.8 L 352.0 272.8 L 352.0 267.3 L 361.3 267.3 L 361.3 261.9 L 370.7 261.9 L 370.7 256.4 L 380.0 256.4 L 380.0 251.0 L 389.3 251.0 L 389.3 245.6 L 398.7 245.6 L 398.7 240.1 L 408.0 240.1 L 408.0 234.7 L 417.3 234.7 L 417.3 229.2 L 426.7 229.2 L 426.7 223.8 L 436.0 223.8 L 436.0 218.4 L 445.3 218.4 L 445.3 212.9 L 454.7 212.9 L 454.7 207.5 L 464.0 207.5 L 464.0 202.0 L 473.3 202.0 L 473.3 196.6 L 482.7 196.6 L 482.7 191.2 L 492.0 191.2 L 492.0 185.7 L 501.3 185.7 L 501.3 180.3 L 510.7 180.3 L 510.7 174.8 L 520.0 174.8 L 520.0 169.4 L 529.3 169.4 L 529.3 164.0 L 538.7 164.0 L 538.7 158.5 L 548.0 158.5 L 548.0 153.1 L 557.3 153.1 L 557.3 147.6 L 566.7 147.6 L 566.7 142.2 L 576.0 142.2 L 576.0 136.8 L 585.3 136.8 L 585.3 131.3 L 594.7 131.3 L 594.7 125.9 L 604.0 125.9 L 604.0 120.4 L 613.3 120.4 L 613.3 115.0 L 622.7 115.0 L 622.7 109.6 L 632.0 109.6 L 632.0 104.1 L 641.3 104.1 L 641.3 98.7 L 650.7 98.7 L 650.7 93.2 L 660.0 93.2 L 660.0 87.8"/>

  <!-- Both annotation blocks live in the wedge under the staircase, which is the only
       empty part of the plot. The wedge is narrow on the left, so the first block
       starts at x=310, where the curve has climbed to y=294.5. Neither block may cross
       x=622.7, where the crossing rule falls: the amount lines are split at 45
       characters for that reason and not for a typographic one.

       EACH BLOCK SITS INSIDE ONE GRIDLINE BAND, and the baselines are chosen for that
       rather than spaced by eye. The bands here are 68px apart and four lines of 12.5px
       leaded at 16 measure 60px from cap top to descender, so there is 4px of clearance
       at each end and no more. A first draft set the headings at 316 and 390, which put
       the 400,000 rule straight through "Minimum balance" as a strikethrough; on the
       page it read as a deleted line rather than as a gridline. -->
  <text class="name" x="310.0" y="327.0">Minimum balance &#8212; a staircase</text>
  <text class="amt" x="310.0" y="343.0">+21,300 &#181;A for the first signature (the box&#8217;s</text>
  <text class="amt" x="310.0" y="359.0">2,500 flat and its 7-byte name), then +16,000</text>
  <text class="amt" x="310.0" y="375.0">&#181;A for every one after.</text>

  <circle class="dot" cx="622.7" cy="109.6" r="3.5"/>
  <text class="name" x="616.7" y="395.0" text-anchor="end">The lines cross here.</text>
  <text class="amt" x="616.7" y="411.0" text-anchor="end">Everything to the right of this line is</text>
  <text class="amt" x="616.7" y="427.0" text-anchor="end">unreachable, and nothing in the contract</text>
  <text class="amt" x="616.7" y="443.0" text-anchor="end">changed to make it so.</text>

  <!-- One dashed run from the crossing down to the panel below, so the leader that
       marks the crossing and the leader that points at the magnification are the same
       stroke. An earlier version routed it out past x=660 and back, which drew a
       three-sided box around the plot and read as a frame rather than as a pointer. -->
  <path class="lead" d="M 622.7 109.6 L 622.7 519.0 L 610.0 540.0"/>

  <text class="ihead" x="150.0" y="526.0">Magnified: the last step that fits, and the first that does not</text>
  <rect class="ipanel" x="150.0" y="540.0" width="460.0" height="158.0"/>
  <!-- Vertical scale 6.0 px per 1,000 microAlgos, about eighteen times the main
       plot's 0.34, which is the whole reason the panel exists. The 16,000 microAlgo
       step is 96px here against 5.44px up there. It was 7.5 px per 1,000 until the
       page-footprint measurement came in; 6.0 still separates the two steps by more
       than a line of type, and the 24px it gives back is page the caption needs.
       The panel is sized to its contents now rather than to a round number: 10px of
       clearance above the first label and 11px below the last. -->
  <line class="bal" x1="166.0" y1="575.8" x2="594.0" y2="575.8"/>
  <path class="floor" d="M 166.0 664.0 L 380.0 664.0 L 380.0 568.0 L 594.0 568.0"/>
  <text class="ival" x="394.0" y="560.0">1,001,300</text>
  <circle class="dot" cx="495.0" cy="568.0" r="3"/>
  <text class="ilab" x="172.0" y="569.0">balance, 1,000,000</text>
  <text class="ilab" x="394.0" y="600.0">56 signatures.</text>
  <text class="ilab" x="394.0" y="616.0">Short by 1,300.</text>
  <text class="ival" x="172.0" y="656.0">985,300</text>
  <circle class="dot" cx="265.0" cy="664.0" r="3"/>
  <text class="ilab" x="172.0" y="684.0">55 signatures. Fits, by 14,700.</text>

  <text class="note" x="30" y="720">Nothing here is a bug in the contract&#8217;s logic. The contract does on the fifty-sixth signature</text>
  <text class="note" x="30" y="738">exactly what it did on the first; what changed is a number kept outside it, in the ledger, by a</text>
  <text class="note" x="30" y="756">rule the code never mentions. That is why the fix is a check the code makes before it writes.</text>
  <text class="note" x="30" y="780">Both plots are to scale. In the main plot the two steps the whole story turns on are five and a</text>
  <text class="note" x="30" y="798">half pixels apart, which is why the inset has to exist.</text>
</svg>
