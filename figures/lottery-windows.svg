<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-label="The lottery's lifecycle on one round axis, drawn twice: the committed run with entry window, lead, target round, draw window and late refund; and the run where the operator never commits, in which the deadline initialize wrote opens the refund path by itself">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6172"/>
    </marker>
  </defs>
  <g font-family="DejaVu Sans, Verdana, sans-serif" fill="#2a2f3a">

    <text x="30" y="44" font-size="15" font-weight="bold">The operator commits</text>

    <!-- window bars -->
    <rect x="90" y="110" width="240" height="36" rx="4" fill="#3d7dd8" fill-opacity="0.15" stroke="#3d7dd8" stroke-width="1.5"/>
    <text x="210" y="133" font-size="14" text-anchor="middle">enter</text>
    <text x="210" y="102" font-size="12.5" text-anchor="middle" fill="#5a6172">open until commit — or r₀ + 1,000</text>

    <rect x="334" y="110" width="132" height="36" rx="4" fill="none" stroke="#5a6172" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="400" y="127" font-size="13" text-anchor="middle">the lead</text>
    <text x="400" y="142" font-size="12" text-anchor="middle" fill="#5a6172">16–1,000 rounds</text>
    <text x="400" y="98" font-size="12.5" text-anchor="middle" fill="#c94f4e">nothing succeeds here</text>

    <rect x="470" y="110" width="220" height="36" rx="4" fill="#3d8a5f" fill-opacity="0.15" stroke="#3d8a5f" stroke-width="1.5"/>
    <text x="580" y="133" font-size="14" text-anchor="middle">draw</text>
    <text x="580" y="102" font-size="12.5" text-anchor="middle" fill="#5a6172">legal in (target, target + 300]</text>

    <rect x="694" y="110" width="126" height="36" rx="4" fill="none" stroke="#3d8a5f" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="757" y="127" font-size="13" text-anchor="middle">refund opens</text>
    <text x="757" y="142" font-size="12" text-anchor="middle" fill="#5a6172">if drawn == 0</text>
    <text x="757" y="102" font-size="12.5" text-anchor="middle" fill="#5a6172">past the deadline</text>

    <!-- axis A -->
    <line x1="70" y1="150" x2="820" y2="150" stroke="#5a6172" stroke-width="1.5" marker-end="url(#mN)"/>
    <line x1="90" y1="144" x2="90" y2="158" stroke="#5a6172" stroke-width="2"/>
    <line x1="330" y1="144" x2="330" y2="158" stroke="#5a6172" stroke-width="2"/>
    <line x1="470" y1="142" x2="470" y2="160" stroke="#3d7dd8" stroke-width="2.5"/>
    <line x1="690" y1="144" x2="690" y2="158" stroke="#5a6172" stroke-width="2"/>

    <text x="90" y="172" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">initialize</text>
    <text x="330" y="172" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">commit(lead)</text>
    <text x="470" y="172" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" fill="#3d7dd8">target</text>
    <text x="690" y="172" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">target + 300</text>

    <text x="44" y="190" font-size="12.5" fill="#5a6172">writes refund_round = r₀ + 1,000</text>
    <text x="470" y="190" font-size="12.5" text-anchor="middle" fill="#5a6172">the beacon publishes for this round</text>
    <text x="690" y="190" font-size="12" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" fill="#5a6172">= refund_round</text>
    <text x="330" y="208" font-size="12.5" text-anchor="middle" fill="#5a6172">writes target; moves the deadline to target + 300</text>

    <text x="70" y="232" font-size="12.5" fill="#5a6172">In the lead: enter refused (a target exists) · draw refused (round not reached) · refund refused (deadline ahead)</text>

    <text x="30" y="290" font-size="15" font-weight="bold">The operator never commits<tspan font-size="13" font-weight="normal" fill="#c94f4e"> — commit never comes; the way out opens anyway</tspan></text>

    <!-- window bars B -->
    <rect x="90" y="356" width="340" height="36" rx="4" fill="#3d7dd8" fill-opacity="0.15" stroke="#3d7dd8" stroke-width="1.5"/>
    <text x="260" y="379" font-size="14" text-anchor="middle">enter</text>
    <text x="260" y="348" font-size="12.5" text-anchor="middle" fill="#5a6172">open until r₀ + 1,000</text>

    <rect x="430" y="356" width="390" height="36" rx="4" fill="#3d8a5f" fill-opacity="0.15" stroke="#3d8a5f" stroke-width="1.5"/>
    <text x="625" y="379" font-size="13" text-anchor="middle">refund — ticket + box MBR back; anybody may call</text>
    <text x="625" y="348" font-size="12.5" text-anchor="middle" fill="#5a6172">opens by itself: round &gt; refund_round, drawn == 0</text>

    <!-- axis B -->
    <line x1="70" y1="396" x2="820" y2="396" stroke="#5a6172" stroke-width="1.5" marker-end="url(#mN)"/>
    <line x1="90" y1="390" x2="90" y2="404" stroke="#5a6172" stroke-width="2"/>
    <line x1="430" y1="390" x2="430" y2="404" stroke="#5a6172" stroke-width="2"/>

    <text x="90" y="418" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">initialize</text>
    <text x="430" y="418" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">r₀ + 1,000</text>
    <text x="44" y="436" font-size="12.5" fill="#5a6172">writes the deadline first</text>
    <text x="430" y="436" font-size="12.5" text-anchor="middle" fill="#5a6172">the deadline initialize wrote — nobody needed to turn up</text>

    <text x="70" y="470" font-size="12.5" fill="#5a6172">One deadline covers both silences: before a commit it ends the entry window; after one it ends the draw window.</text>
  </g>
</svg>
