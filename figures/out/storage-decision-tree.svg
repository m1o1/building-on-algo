<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="DejaVu Sans, sans-serif">
  <!-- Where does this data go? Three questions, asked in the order that costs
       the least to answer wrong. Drawn in greys and dash patterns only: the
       print edition is black and white, so nothing here may mean anything by
       hue alone. -->
  <style>
    text { fill: #111111; }
    .q    { fill: #f2f2f2; stroke: #333333; stroke-width: 1.5; }
    .a    { fill: #e0e0e0; stroke: #333333; stroke-width: 2; }
    .last { fill: #ffffff; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .qt   { font-size: 15px; font-weight: bold; }
    .at   { font-size: 15px; font-weight: bold; }
    .sub  { font-size: 11.5px; fill: #333333; }
    .edge { fill: none; stroke: #333333; stroke-width: 1.5; }
    .lbl  { font-size: 12px; fill: #333333; font-style: italic; }
    .note { font-size: 12px; fill: #333333; font-style: italic; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- question 1 -->
  <rect class="q" x="20" y="24" width="400" height="62" rx="4"/>
  <text class="qt" x="220" y="61" text-anchor="middle">One value, shared by every caller?</text>
  <rect class="a" x="490" y="16" width="310" height="78" rx="4"/>
  <text class="at"  x="645" y="42" text-anchor="middle">Global state</text>
  <text class="sub" x="645" y="62" text-anchor="middle">64 key-value pairs, 128 B each</text>
  <text class="sub" x="645" y="80" text-anchor="middle">28,500 µA per uint, 50,000 per bytes</text>
  <path class="edge" d="M 420 55 L 484 55" marker-end="url(#arrow)"/>
  <text class="lbl" x="452" y="47" text-anchor="middle">yes</text>
  <path class="edge" d="M 220 86 L 220 138" marker-end="url(#arrow)"/>
  <text class="lbl" x="230" y="118">no</text>

  <!-- question 2 -->
  <rect class="q" x="20" y="144" width="400" height="62" rx="4"/>
  <text class="qt" x="220" y="170" text-anchor="middle">One value per account &#8212; and will</text>
  <text class="qt" x="220" y="190" text-anchor="middle">they opt in, and stay opted in?</text>
  <rect class="a" x="490" y="136" width="310" height="78" rx="4"/>
  <text class="at"  x="645" y="162" text-anchor="middle">Local state</text>
  <text class="sub" x="645" y="182" text-anchor="middle">16 key-value pairs per account</text>
  <text class="sub" x="645" y="200" text-anchor="middle">their balance is pinned, not yours</text>
  <path class="edge" d="M 420 175 L 484 175" marker-end="url(#arrow)"/>
  <text class="lbl" x="452" y="167" text-anchor="middle">yes</text>
  <path class="edge" d="M 220 206 L 220 258" marker-end="url(#arrow)"/>
  <text class="lbl" x="230" y="238">no</text>

  <!-- question 3 -->
  <rect class="q" x="20" y="264" width="400" height="62" rx="4"/>
  <text class="qt" x="220" y="290" text-anchor="middle">Must it outlive the opt-in, or grow</text>
  <text class="qt" x="220" y="310" text-anchor="middle">past what one key-value pair holds?</text>
  <rect class="a" x="490" y="256" width="310" height="78" rx="4"/>
  <text class="at"  x="645" y="282" text-anchor="middle">Box, or BoxMap</text>
  <text class="sub" x="645" y="302" text-anchor="middle">32,768 B of value, 2,048 B of name</text>
  <text class="sub" x="645" y="320" text-anchor="middle">2,500 + 400 × (name + size) µA</text>
  <path class="edge" d="M 420 295 L 484 295" marker-end="url(#arrow)"/>
  <text class="lbl" x="452" y="287" text-anchor="middle">yes</text>
  <path class="edge" d="M 220 326 L 220 378" marker-end="url(#arrow)"/>
  <text class="lbl" x="230" y="358">no</text>

  <!-- fall-through -->
  <rect class="last" x="20" y="384" width="400" height="62" rx="4"/>
  <text class="qt" x="220" y="410" text-anchor="middle">Keep it off-chain. Put a hash</text>
  <text class="qt" x="220" y="430" text-anchor="middle">on-chain and prove it later.</text>

  <text class="note" x="20" y="482">Every tier above is bought with Algo that is locked, not spent. Opt out, or delete the box, and it comes back.</text>
</svg>
