<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="DejaVu Sans, sans-serif">
  <!-- An ABI call, byte by byte. Everything here is the real encoding: the
       selector is the first four bytes of sha512_256("add(uint64,uint64)uint64"),
       and 151f7c75 is the return prefix every ABI method in every contract
       shares. A reader who has seen this once can decode a raw app call by eye. -->
  <style>
    text { fill: #111111; }
    .step  { font-size: 13.5px; font-weight: bold; }
    .cell  { fill: #f2f2f2; stroke: #333333; stroke-width: 1.5; }
    .hi    { fill: #d2d2d2; stroke: #333333; stroke-width: 2; }
    .dim   { fill: #ffffff; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .mono  { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; }
    .sub   { font-size: 11.5px; fill: #333333; }
    .note  { font-size: 12px; fill: #333333; font-style: italic; }
    .arr   { stroke: #333333; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- 1: the selector -->
  <text class="step" x="30" y="40">1 &#183; The signature is hashed. The first four bytes are the selector.</text>
  <rect class="cell" x="30" y="54" width="250" height="36"/>
  <text class="mono" x="155" y="77" text-anchor="middle">add(uint64,uint64)uint64</text>
  <path class="arr" d="M 284 72 L 394 72" marker-end="url(#a2)"/>
  <text class="sub" x="339" y="66" text-anchor="middle">sha512_256</text>
  <rect class="hi"  x="400" y="54" width="100" height="36"/>
  <text class="mono" x="450" y="77" text-anchor="middle">fe6bdf69</text>
  <rect class="dim" x="500" y="54" width="340" height="36"/>
  <text class="mono" x="670" y="77" text-anchor="middle">c3ac917f &#8230; 24 more bytes</text>
  <text class="sub" x="450" y="106" text-anchor="middle">kept</text>
  <text class="sub" x="670" y="106" text-anchor="middle">thrown away</text>

  <!-- 2: the wire -->
  <text class="step" x="30" y="152">2 &#183; What actually travels: the app-args array.</text>
  <rect class="hi"   x="30"  y="166" width="180" height="44"/>
  <text class="mono" x="120" y="194" text-anchor="middle">fe6bdf69</text>
  <rect class="cell" x="218" y="166" width="300" height="44"/>
  <text class="mono" x="368" y="194" text-anchor="middle">00 00 00 00 00 00 00 07</text>
  <rect class="cell" x="526" y="166" width="300" height="44"/>
  <text class="mono" x="676" y="194" text-anchor="middle">00 00 00 00 00 00 00 0b</text>
  <text class="sub" x="120" y="228" text-anchor="middle">args[0] &#183; 4 B &#183; the selector</text>
  <text class="sub" x="368" y="228" text-anchor="middle">args[1] &#183; 8 B &#183; uint64, big-endian &#8594; 7</text>
  <text class="sub" x="676" y="228" text-anchor="middle">args[2] &#183; 8 B &#183; uint64, big-endian &#8594; 11</text>
  <text class="note" x="30" y="256">Sixteen slots, and the selector takes one. A method with more than fifteen arguments has its tail packed into a tuple in the last slot.</text>

  <!-- 3: the return -->
  <text class="step" x="30" y="302">3 &#183; The return value comes back as a log entry, behind its own four-byte prefix.</text>
  <rect class="hi"   x="30"  y="316" width="180" height="44"/>
  <text class="mono" x="120" y="344" text-anchor="middle">151f7c75</text>
  <rect class="cell" x="218" y="316" width="300" height="44"/>
  <text class="mono" x="368" y="344" text-anchor="middle">00 00 00 00 00 00 00 12</text>
  <text class="sub" x="120" y="378" text-anchor="middle">4 B &#183; the return prefix</text>
  <text class="sub" x="368" y="378" text-anchor="middle">8 B &#183; uint64 &#8594; 18</text>
  <text class="note" x="30" y="406">The same prefix on every ABI method in every contract. It is how a client tells a return value from an ordinary log line.</text>

  <!-- 4: dynamic types -->
  <text class="step" x="30" y="452">A dynamic type carries its own length. arc4.String(&#8220;hi&#8221;) on the wire:</text>
  <rect class="cell" x="30"  y="466" width="150" height="44"/>
  <text class="mono" x="105" y="494" text-anchor="middle">00 02</text>
  <rect class="cell" x="188" y="466" width="150" height="44"/>
  <text class="mono" x="263" y="494" text-anchor="middle">68 69</text>
  <text class="sub" x="105" y="528" text-anchor="middle">2 B &#183; length</text>
  <text class="sub" x="263" y="528" text-anchor="middle">the bytes themselves</text>
  <text class="note" x="360" y="494">A fixed-size type has no length prefix, because the ABI already knows how wide it is.</text>
  <text class="note" x="360" y="514">That is the whole difference, and it is why a tuple of dynamic types needs offsets.</text>
</svg>
