<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 660" width="700" height="660" font-family="DejaVu Sans, sans-serif">
  <!-- A failed simulate response, annotated. The point the numbered notes are
       arranged to make is the one that trips everybody the first time: the HTTP
       call succeeded. Simulate reports the failure in the body. Anyone checking
       the status code and moving on has just written a test that cannot fail. -->
  <!-- THE CANVAS WIDTH IS A TYPE SIZE. The book scales every figure to the
       470.4pt text width and never scales one up, so a drawing's on&#8209;page type is
       font_px x 0.75 x 470.4 / (0.75 x width_px), which reduces to
       font_px &gt;= width_px / 58.8 for the house's 8pt floor. At the original 940px
       the 11px gutter digits landed at 5.50pt, the worst type in the book.

       The width was not carrying any drawing. It was carrying a two&#8209;column text
       layout: a 500px JSON pane beside a 316px legend column, both set at
       whatever size happened to fit. Widening type in place is circular, because
       wider type needs a wider canvas and a wider canvas needs wider type again.
       The only lever is to spend the same character count on a narrower measure,
       so the JSON is re&#8209;wrapped at 46 monospace columns and the legend at 32
       proportional ones, and the canvas comes in to 700px where 12.5px type sets
       at 8.40pt. The character count is almost unchanged; only the measure is.

       Height is the second constraint and it is easy to lose sight of while
       fixing the first. Past width x 619/470.4 = 921px the height rather than
       the width binds and every size shrinks again, and long before that a
       figure that runs 590pt tall eats a whole page. Keeping the legend beside
       the pane rather than under it is what holds this one to 660px: stacked,
       the same content measured 880px and would have doubled the figure's
       footprint to buy nothing the reader can see. -->
  <style>
    text { fill: #111111; }
    .hdr   { fill: #e0e0e0; stroke: #333333; stroke-width: 1.5; }
    .pane  { fill: #fafafa; stroke: #333333; stroke-width: 1.5; }
    .mono  { font-family: "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .hdrt  { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: bold; }
    .mark  { fill: #333333; stroke: none; }
    .markt { fill: #ffffff; font-size: 12.5px; font-weight: bold; }
    .leg   { font-size: 12.5px; }
    .note  { font-size: 12.5px; font-style: italic; fill: #333333; }
  </style>

  <rect class="hdr"  x="16" y="16" width="378" height="36"/>
  <text class="hdrt" x="30" y="39">POST /v2/transactions/simulate  &#8594;  200 OK</text>
  <rect class="pane" x="16" y="52" width="378" height="502"/>

  <!-- xml:space is load-bearing: without it the leading spaces collapse and the
       nesting that tells the reader which object each key sits in disappears.

       The failure&#8209;message string is shown wrapped across three lines because it
       is one string and does not fit on one; the continuation indent is a
       display convention, not part of the value. The `transaction H6BX...2NQ4: `
       prefix is part of the value and every algod failure message carries it.
       It has been dropped from this figure twice in successive rounds while the
       prose on the facing page carried it, which is what the check on quoted
       strings in figures exists to catch. -->
  <g xml:space="preserve">
    <text class="mono" x="30" y="76">{</text>
    <text class="mono" x="30" y="98">  "last-round": 41528301,</text>
    <text class="mono" x="30" y="120">  "txn-groups": [</text>
    <text class="mono" x="30" y="142">    {</text>
    <text class="mono" x="30" y="164">      "failed-at": [2],</text>
    <text class="mono" x="30" y="186">      "failure-message":</text>
    <text class="mono" x="30" y="208">        "transaction H6BX...2NQ4: logic eval</text>
    <text class="mono" x="30" y="230">         error: assert failed pc=142. Details:</text>
    <text class="mono" x="30" y="252">         app=8842, pc=142, opcodes=...",</text>
    <text class="mono" x="30" y="274">      "txn-results": [</text>
    <text class="mono" x="30" y="296">        { "txn-result": { ... } },</text>
    <text class="mono" x="30" y="318">        { "txn-result": { ... } },</text>
    <text class="mono" x="30" y="340">        { "app-budget-consumed": 683,</text>
    <text class="mono" x="30" y="362">          "exec-trace": {</text>
    <text class="mono" x="30" y="384">            "approval-program-trace": [ ... ]</text>
    <text class="mono" x="30" y="406">          } }</text>
    <text class="mono" x="30" y="428">      ]</text>
    <text class="mono" x="30" y="450">    }</text>
    <text class="mono" x="30" y="472">  ],</text>
    <text class="mono" x="30" y="494">  "eval-overrides": {</text>
    <text class="mono" x="30" y="516">    "allow-empty-signatures": true</text>
    <text class="mono" x="30" y="538">  }</text>
  </g>

  <!-- Gutter markers, each on the line it is about. They sit 3.5px off the
       pane's right border and 25.5px off the legend's circles, and the two gaps
       are the whole reason the reader can tell which column a circle belongs
       to. A first draft had them 20px off the pane and 8px off the legend, so
       gutter 1 came to rest beside the second line of legend entry 2 and the
       pair read as one unit. Aligning each legend entry with its own marker
       instead would be better still and is not possible here: markers 1 and 2
       are on adjacent JSON lines, 22px apart, and no two legend entries can
       start within 22px of each other. -->
  <circle class="mark" cx="407" cy="160" r="9.5"/><text class="markt" x="407" y="164.5" text-anchor="middle">1</text>
  <circle class="mark" cx="407" cy="182" r="9.5"/><text class="markt" x="407" y="186.5" text-anchor="middle">2</text>
  <circle class="mark" cx="407" cy="226" r="9.5"/><text class="markt" x="407" y="230.5" text-anchor="middle">3</text>
  <circle class="mark" cx="407" cy="336" r="9.5"/><text class="markt" x="407" y="340.5" text-anchor="middle">4</text>
  <circle class="mark" cx="407" cy="512" r="9.5"/><text class="markt" x="407" y="516.5" text-anchor="middle">5</text>

  <!-- Legend. Every line is 30 characters or fewer, which is what the 214px
       between the legend's text edge and the canvas edge buys at 12.5px: the
       widest glyph mix measured here runs 6.95px per character, so 30 is 208px
       and 32 would have been 222px, over the edge. The entries are stacked in
       reading order; the numbers carry the mapping back to the gutter. -->
  <circle class="mark" cx="452" cy="72" r="10"/><text class="markt" x="452" y="76.5" text-anchor="middle">1</text>
  <text class="leg" x="470" y="76">Which transaction in the group</text>
  <text class="leg" x="470" y="94">failed. Zero-indexed, so this</text>
  <text class="leg" x="470" y="112">is the third one.</text>

  <circle class="mark" cx="452" cy="140" r="10"/><text class="markt" x="452" y="144.5" text-anchor="middle">2</text>
  <text class="leg" x="470" y="144">Where the error text lives &#8212;</text>
  <text class="leg" x="470" y="162">the assert that fired, wrapper</text>
  <text class="leg" x="470" y="180">and all, as one long string.</text>

  <circle class="mark" cx="452" cy="208" r="10"/><text class="markt" x="452" y="212.5" text-anchor="middle">3</text>
  <text class="leg" x="470" y="212">The program counter &#8212; how far</text>
  <text class="leg" x="470" y="230">the program got before the</text>
  <text class="leg" x="470" y="248">assert fired. Feed it to the</text>
  <text class="leg" x="470" y="266">source map PuyaPy wrote</text>
  <text class="leg" x="470" y="284">beside the TEAL, and it</text>
  <text class="leg" x="470" y="302">becomes a line number in</text>
  <text class="leg" x="470" y="320">your own file.</text>

  <circle class="mark" cx="452" cy="348" r="10"/><text class="markt" x="452" y="352.5" text-anchor="middle">4</text>
  <text class="leg" x="470" y="352">Opcode budget actually</text>
  <text class="leg" x="470" y="370">consumed: 683 of 700. One</text>
  <text class="leg" x="470" y="388">more loop iteration and this</text>
  <text class="leg" x="470" y="406">call fails for an entirely</text>
  <text class="leg" x="470" y="424">different reason.</text>

  <circle class="mark" cx="452" cy="452" r="10"/><text class="markt" x="452" y="456.5" text-anchor="middle">5</text>
  <text class="leg" x="470" y="456">Why simulate could run it at</text>
  <text class="leg" x="470" y="474">all &#8212; it takes unsigned</text>
  <text class="leg" x="470" y="492">transactions. That is exactly</text>
  <text class="leg" x="470" y="510">what makes it usable for</text>
  <text class="leg" x="470" y="528">negative tests.</text>

  <text class="note" x="16" y="590">The request succeeded. The group did not. A test that asserts on the status code and stops</text>
  <text class="note" x="16" y="610">there can never fail, no matter what the contract does &#8212; read failure-message, or assert</text>
  <text class="note" x="16" y="630">nothing at all.</text>
</svg>
