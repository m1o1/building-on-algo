<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" font-family="DejaVu Sans, sans-serif">
  <!-- A failed simulate response, annotated. The point the numbered notes are
       arranged to make is the one that trips everybody the first time: the HTTP
       call succeeded. Simulate reports the failure in the body. Anyone checking
       the status code and moving on has just written a test that cannot fail. -->
  <style>
    text { fill: #111111; }
    .hdr   { fill: #e0e0e0; stroke: #333333; stroke-width: 1.5; }
    .pane  { fill: #fafafa; stroke: #333333; stroke-width: 1.5; }
    .mono  { font-family: "DejaVu Sans Mono", monospace; font-size: 12px; }
    .hdrt  { font-family: "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: bold; }
    .mark  { fill: #333333; stroke: none; }
    .markt { fill: #ffffff; font-size: 11px; font-weight: bold; }
    .leg   { font-size: 12.5px; }
    .note  { font-size: 12.5px; font-style: italic; fill: #333333; }
  </style>

  <rect class="hdr"  x="20" y="20" width="500" height="38"/>
  <text class="hdrt" x="34" y="44">POST /v2/transactions/simulate  &#8594;  200 OK</text>
  <rect class="pane" x="20" y="58" width="500" height="452"/>

  <!-- xml:space is load-bearing: without it the leading spaces collapse and the
       nesting that tells the reader which object each key sits in disappears. -->
  <g xml:space="preserve">
    <text class="mono" x="34" y="80">{</text>
    <text class="mono" x="34" y="101">  "last-round": 41528301,</text>
    <text class="mono" x="34" y="122">  "txn-groups": [</text>
    <text class="mono" x="34" y="143">    {</text>
    <text class="mono" x="34" y="164">      "failed-at": [2],</text>
    <text class="mono" x="34" y="185">      "failure-message":</text>
    <text class="mono" x="34" y="206">        "logic eval error: assert failed.</text>
    <text class="mono" x="34" y="227">         pc=142",</text>
    <text class="mono" x="34" y="248">      "txn-results": [</text>
    <text class="mono" x="34" y="269">        { "txn-result": { ... } },</text>
    <text class="mono" x="34" y="290">        { "txn-result": { ... } },</text>
    <text class="mono" x="34" y="311">        { "app-budget-consumed": 683,</text>
    <text class="mono" x="34" y="332">          "exec-trace": {</text>
    <text class="mono" x="34" y="353">            "approval-program-trace": [ ... ]</text>
    <text class="mono" x="34" y="374">          } }</text>
    <text class="mono" x="34" y="395">      ]</text>
    <text class="mono" x="34" y="416">    }</text>
    <text class="mono" x="34" y="437">  ],</text>
    <text class="mono" x="34" y="458">  "eval-overrides": {</text>
    <text class="mono" x="34" y="479">    "allow-empty-signatures": true</text>
    <text class="mono" x="34" y="500">  }</text>
  </g>

  <!-- gutter markers, each on the line it is about -->
  <circle class="mark" cx="536" cy="160" r="9"/><text class="markt" x="536" y="164" text-anchor="middle">1</text>
  <circle class="mark" cx="536" cy="181" r="9"/><text class="markt" x="536" y="185" text-anchor="middle">2</text>
  <circle class="mark" cx="536" cy="223" r="9"/><text class="markt" x="536" y="227" text-anchor="middle">3</text>
  <circle class="mark" cx="536" cy="307" r="9"/><text class="markt" x="536" y="311" text-anchor="middle">4</text>
  <circle class="mark" cx="536" cy="475" r="9"/><text class="markt" x="536" y="479" text-anchor="middle">5</text>

  <!-- legend -->
  <circle class="mark" cx="596" cy="85" r="9"/><text class="markt" x="596" y="89" text-anchor="middle">1</text>
  <text class="leg" x="614" y="82">Which transaction in the group failed.</text>
  <text class="leg" x="614" y="99">Zero-indexed, so this is the third one.</text>

  <circle class="mark" cx="596" cy="163" r="9"/><text class="markt" x="596" y="167" text-anchor="middle">2</text>
  <text class="leg" x="614" y="160">The assert that fired. Everything above it in</text>
  <text class="leg" x="614" y="177">the program had already run.</text>

  <circle class="mark" cx="596" cy="241" r="9"/><text class="markt" x="596" y="245" text-anchor="middle">3</text>
  <text class="leg" x="614" y="238">The program counter. Feed it to the source map</text>
  <text class="leg" x="614" y="255">puyapy wrote beside the TEAL and it becomes a</text>
  <text class="leg" x="614" y="272">line number in your own file.</text>

  <circle class="mark" cx="596" cy="336" r="9"/><text class="markt" x="596" y="340" text-anchor="middle">4</text>
  <text class="leg" x="614" y="333">Opcode budget actually consumed: 683 of 700.</text>
  <text class="leg" x="614" y="350">One more loop iteration and this call fails for</text>
  <text class="leg" x="614" y="367">an entirely different reason.</text>

  <circle class="mark" cx="596" cy="431" r="9"/><text class="markt" x="596" y="435" text-anchor="middle">5</text>
  <text class="leg" x="614" y="428">Why simulate could run it at all &#8212; it takes</text>
  <text class="leg" x="614" y="445">unsigned transactions. That is exactly what</text>
  <text class="leg" x="614" y="462">makes it usable for negative tests.</text>

  <text class="note" x="20" y="546">The request succeeded. The group did not. A test that asserts on the status code and stops there can never fail,</text>
  <text class="note" x="20" y="566">no matter what the contract does &#8212; read failure-message, or assert nothing at all.</text>
</svg>
