<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 508" role="img" aria-label="A failed simulate response annotated with five numbered stops: the failing transaction's index, the failure message, the execution trace, the budget consumed, and the override that let an unsigned group run">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6172"/>
    </marker>
  </defs>
  <g font-family="DejaVu Sans, Verdana, sans-serif" fill="#2a2f3a">

    <!-- top strip: the rehearsal path -->
    <rect x="30" y="22" width="180" height="58" rx="8" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
    <text x="120" y="46" font-size="15" text-anchor="middle">your group</text>
    <text x="120" y="66" font-size="13" text-anchor="middle" fill="#5a6172">signed or not</text>

    <line x1="212" y1="51" x2="292" y2="51" stroke="#5a6172" stroke-width="1.5" marker-end="url(#mN)"/>

    <rect x="295" y="22" width="290" height="58" rx="8" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
    <text x="440" y="44" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">POST /v2/transactions/simulate</text>
    <text x="440" y="66" font-size="13" text-anchor="middle" fill="#5a6172">runs it against the real current ledger</text>

    <line x1="587" y1="51" x2="667" y2="51" stroke="#5a6172" stroke-width="1.5" marker-end="url(#mN)"/>

    <rect x="670" y="22" width="160" height="58" rx="8" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
    <text x="750" y="46" font-size="15" text-anchor="middle">nothing committed</text>
    <text x="750" y="66" font-size="13" text-anchor="middle" fill="#5a6172">evaluated, thrown away</text>

    <text x="30" y="110" font-size="13" fill="#5a6172">The submit endpoint answers a failure with one message and nothing else. Everything below exists only here.</text>

    <!-- response body panel -->
    <rect x="30" y="128" width="800" height="360" rx="8" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
    <path d="M30 166 L30 136 Q30 128 38 128 L822 128 Q830 128 830 136 L830 166 Z" fill="#e8eaef" stroke="none"/>
    <line x1="30" y1="166" x2="830" y2="166" stroke="#5a6172" stroke-width="1.5"/>
    <text x="48" y="152" font-size="14" font-family="DejaVu Sans Mono, monospace">HTTP/1.1 200 OK</text>
    <text x="188" y="152" font-size="13" fill="#5a6172">— the request succeeded; the failure is in the body</text>

    <!-- highlight bars behind the five stops -->
    <g fill="#3d7dd8" opacity="0.12">
      <rect x="44" y="222" width="200" height="21" rx="4"/>
      <rect x="44" y="243" width="480" height="21" rx="4"/>
      <rect x="44" y="285" width="516" height="21" rx="4"/>
      <rect x="44" y="348" width="268" height="21" rx="4"/>
      <rect x="44" y="390" width="428" height="21" rx="4"/>
    </g>

    <!-- the JSON body -->
    <g font-family="DejaVu Sans Mono, monospace" font-size="13">
      <text x="52" y="196">{</text>
      <text x="52" y="217">  "txn-groups": [{</text>
      <text x="52" y="238">    "failed-at": [0],</text>
      <text x="52" y="259">    "failure-message": "…logic eval error: assert failed pc=142",</text>
      <text x="52" y="280">    "txn-results": [{</text>
      <text x="52" y="301">      "exec-trace": { "approval-program-trace": [ … ] },</text>
      <text x="52" y="322">      "txn-result": { "logs": [ … ] }</text>
      <text x="52" y="343">    }],</text>
      <text x="52" y="364">    "app-budget-consumed": 289</text>
      <text x="52" y="385">  }],</text>
      <text x="52" y="406">  "eval-overrides": { "allow-empty-signatures": true }</text>
      <text x="52" y="427">}</text>
    </g>

    <!-- numbered stops -->
    <g>
      <circle cx="588" cy="233" r="11" fill="#3d7dd8"/>
      <text x="588" y="238" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <line x1="252" y1="233" x2="574" y2="233" stroke="#3d7dd8" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="606" y="238" font-size="13">which transaction — an index into the group</text>

      <circle cx="588" cy="254" r="11" fill="#3d7dd8"/>
      <text x="588" y="259" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <line x1="532" y1="254" x2="574" y2="254" stroke="#3d7dd8" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="606" y="259" font-size="13">what it said — message and pc</text>

      <circle cx="588" cy="296" r="11" fill="#3d7dd8"/>
      <text x="588" y="301" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <line x1="566" y1="296" x2="574" y2="296" stroke="#3d7dd8" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="606" y="294" font-size="13">where it stopped — every opcode,</text>
      <text x="606" y="310" font-size="13">stack and scratch, up to the halt</text>

      <circle cx="588" cy="359" r="11" fill="#3d7dd8"/>
      <text x="588" y="364" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <line x1="320" y1="359" x2="574" y2="359" stroke="#3d7dd8" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="606" y="357" font-size="13">what it cost — opcodes consumed,</text>
      <text x="606" y="373" font-size="13">at group level: the whole group's</text>

      <circle cx="588" cy="401" r="11" fill="#3d7dd8"/>
      <text x="588" y="406" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
      <line x1="480" y1="401" x2="574" y2="401" stroke="#3d7dd8" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="606" y="399" font-size="13">why it could run unsigned —</text>
      <text x="606" y="415" font-size="13">simulate was told to allow it</text>
    </g>

    <text x="52" y="466" font-size="13" fill="#5a6172">Logs from a failing group survive only here. A submitted failure returns no logs and no trace — a pc and a message.</text>
  </g>
</svg>
