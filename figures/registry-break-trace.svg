<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img"
     aria-label="Three moments in which the registry loses 4,200 credits: Alice's local slab is deleted by a ClearState transaction the application's global slab never observes, leaving the member count permanently wrong"
     font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5a6172"/>
    </marker>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c94f4e"/>
    </marker>
  </defs>

  <!-- time axis -->
  <text x="20" y="56" font-size="13" fill="#5a6172">time</text>
  <line x1="34" y1="66" x2="34" y2="444" stroke="#5a6172" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- column headers -->
  <text x="355" y="36" font-size="15" font-weight="600" fill="#2a2f3a" text-anchor="middle">Application 1042 — global slab</text>
  <text x="670" y="36" font-size="15" font-weight="600" fill="#2a2f3a" text-anchor="middle">Alice's account — local slab</text>

  <!-- Moment 1 -->
  <text x="56" y="88" font-size="15" font-weight="600" fill="#2a2f3a">Moment 1</text>
  <text x="56" y="110" font-size="13" fill="#2a2f3a">Alice and Bob join;</text>
  <text x="56" y="128" font-size="13" fill="#2a2f3a">Alice is awarded</text>
  <text x="56" y="146" font-size="13" fill="#2a2f3a">4,200 credits</text>

  <rect x="210" y="60" width="290" height="110" rx="8" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
  <text x="230" y="92" font-size="14" fill="#2a2f3a" font-family="DejaVu Sans Mono, monospace">member_count = 2</text>
  <text x="230" y="122" font-size="13" fill="#3d8a5f">correct — it counts</text>
  <text x="230" y="140" font-size="13" fill="#3d8a5f">Alice and Bob</text>

  <rect x="520" y="60" width="300" height="110" rx="8" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
  <text x="540" y="92" font-size="14" fill="#2a2f3a" font-family="DejaVu Sans Mono, monospace">joined_at = 4711</text>
  <text x="540" y="114" font-size="14" fill="#2a2f3a" font-family="DejaVu Sans Mono, monospace">credits   = 4200</text>
  <text x="540" y="144" font-size="13" fill="#5a6172">the only record of the 4,200</text>

  <!-- Moment 2 -->
  <text x="56" y="218" font-size="15" font-weight="600" fill="#2a2f3a">Moment 2</text>
  <text x="56" y="240" font-size="13" fill="#2a2f3a">Alice leaves the</text>
  <text x="56" y="258" font-size="13" fill="#2a2f3a">other way</text>

  <rect x="210" y="190" width="290" height="110" rx="8" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
  <text x="230" y="222" font-size="14" fill="#2a2f3a" font-family="DejaVu Sans Mono, monospace">member_count = 2</text>
  <text x="230" y="252" font-size="13" fill="#5a6172">unchanged — no event, no</text>
  <text x="230" y="270" font-size="13" fill="#5a6172">method call, nothing to observe</text>

  <rect x="520" y="190" width="300" height="36" rx="8" fill="#f4f5f7" stroke="#c94f4e" stroke-width="2"/>
  <text x="670" y="213" font-size="13" fill="#2a2f3a" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Alice: OnComplete=ClearState</text>
  <line x1="670" y1="226" x2="670" y2="240" stroke="#c94f4e" stroke-width="1.5" marker-end="url(#aD)"/>
  <rect x="520" y="244" width="300" height="56" rx="8" fill="#f4f5f7" stroke="#c94f4e" stroke-width="1.5"/>
  <text x="802" y="266" font-size="15" fill="#c94f4e" text-anchor="end">✗</text>
  <text x="670" y="268" font-size="13" fill="#2a2f3a" text-anchor="middle">slab deleted —</text>
  <text x="670" y="288" font-size="13" fill="#2a2f3a" text-anchor="middle">an exit the contract cannot refuse</text>

  <!-- Moment 3 -->
  <text x="56" y="358" font-size="15" font-weight="600" fill="#2a2f3a">Moment 3</text>
  <text x="56" y="380" font-size="13" fill="#2a2f3a">every read from</text>
  <text x="56" y="398" font-size="13" fill="#2a2f3a">now on</text>

  <rect x="210" y="330" width="290" height="110" rx="8" fill="#f4f5f7" stroke="#5a6172" stroke-width="1.5"/>
  <text x="230" y="362" font-size="14" fill="#2a2f3a" font-family="DejaVu Sans Mono, monospace">member_count = 2</text>
  <text x="230" y="392" font-size="13" fill="#c94f4e">wrong — Alice is gone, and no</text>
  <text x="230" y="410" font-size="13" fill="#c94f4e">method can ever repair it</text>

  <rect x="520" y="330" width="300" height="110" rx="8" fill="none" stroke="#5a6172" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="670" y="360" font-size="15" fill="#5a6172" text-anchor="middle">no slab</text>
  <text x="670" y="386" font-size="13" fill="#5a6172" text-anchor="middle">the 4,200 credits, and the record</text>
  <text x="670" y="404" font-size="13" fill="#5a6172" text-anchor="middle">that they were owed: gone</text>
  <text x="670" y="428" font-size="13" fill="#c94f4e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">credits_of(alice) → rejects</text>

  <!-- bottom note -->
  <text x="56" y="472" font-size="13" fill="#2a2f3a">The deletion is a transaction against Alice's account, not a call into the application: the left column</text>
  <text x="56" y="491" font-size="13" fill="#2a2f3a">never observes it, which is why its count is wrong from that instant and cannot be repaired.</text>
</svg>
