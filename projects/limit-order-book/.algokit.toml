[algokit]
min_version = "v2.10.0"

[project]
type = "contract"
name = "limit-order-book"
artifacts = "smart_contracts/artifacts"

[project.run]
build = { commands = [
  "poetry run python -m smart_contracts build",
], description = "Build the order book contract and the limit order LogicSig" }

test = { commands = [
  "poetry run pytest -q",
], description = "Run tests; LocalNet tests skip when unavailable" }

test-static = { commands = [
  "poetry run pytest tests/test_contract_shape.py -q",
], description = "Run static contract-shape checks without LocalNet" }

demo = { commands = [
  "poetry run python -m scripts.run_limit_order_book",
], description = "Deploy, place an order, and fill it as a keeper would" }

keeper = { commands = [
  "poetry run python -m scripts.keeper",
], description = "Run a keeper against the book the demo left behind" }
