[algokit]
min_version = "v2.10.0"

[project]
type = "contract"
name = "lottery"
artifacts = "smart_contracts/artifacts"

[project.run]
build = { commands = [
  "poetry run python -m smart_contracts build",
], description = "Build both contracts at --target-avm-version=13" }

test = { commands = [
  "poetry run pytest -q",
], description = "Run tests; LocalNet tests skip when unavailable" }

test-static = { commands = [
  "poetry run pytest tests/test_contract_shape.py -q",
], description = "Run static contract-shape checks without LocalNet" }

lottery = { commands = [
  "poetry run python -m scripts.run_lottery",
], description = "Deploy, enter, commit, draw, and refund a silent beacon" }
