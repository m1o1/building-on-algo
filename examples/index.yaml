# examples/index.yaml — one entry per numbered example in the book.
#
# GENERATED, eventually. Until the chapter sources carry example front matter
# (Phase 5), this file is hand-maintained and the entries below are the Phase 0
# proof that the harness works end to end, extended by the Phase 4 pilot. A
# hand-maintained index of ~470 files drifts within a month, which is why the
# generator is scheduled rather than optional.
#
# Fields:
#   slug     stable identity. Referenced from prose as {{ex:slug}}. Never changes.
#   path     relative to examples/. THIS FILE IS WHAT THE BOOK PRINTS (check 9).
#   tier     core | extended | minibuild. Sets the printed-line budget (check 10):
#            core <= 35 lines, extended <= 20, minibuild <= 90.
#            `minibuild` is the once-per-chapter Mini-Build of §2.4. It is a
#            tier rather than an exemption so check 10 still bounds it.
#   mode     compile | compile-fail | unit | localnet | script
#            EVERY mode except compile-fail and script compiles the example —
#            the Completeness Contract says a printed artifact builds, so `unit`
#            means "compiles AND its test passes", not "skip the compile".
#            `script` is a client-side program that does not run on the AVM;
#            it is byte-compiled instead of being fed to puyapy.
#   chapter  destination chapter number in the v2 map (informational)
#   expect   compile-fail only. Substring that MUST appear in stderr. Without
#            it a compile-fail example passes when it fails for a typo.
#   test     unit only. Test file, relative to examples/. Lives on disk and is
#            not printed; only its load-bearing assertion is quoted in prose.
#
# Note on counts: a chapter always registers more entries than it numbers.
# Chapter 1 numbers nine and registers eleven; Chapter 2 numbers twenty-one and
# registers twenty-five; Chapter 3 numbers twenty and registers twenty-two.
# The extra entries have two different reasons.
#   1. Slot 5 of the micro-example anatomy (§2.2) is a *wrong variant* — printed
#      beside its example and sharing its number, but a separate file so CI
#      compiles it. `reference-types-wrong` is Chapter 1's, `local-balance-wrong`
#      is Chapter 3's. Wrong variants are always `extended`, so the Core budget
#      cannot be evaded by splitting an example in two.
#   2. `greeter-fixed`, `counter-fixed` and `registry-fixed` are compiled but
#      never printed; §2.4 presents a fixed Mini-Build as a diff, not as a
#      re-listing.
# An entry that is registered but not placed is legal: check 3's orphan-number
# rule is scoped to tbl: and fig: only.

examples:
  # -- Chapter 1, the Mini-Build ---------------------------------------------
  # Placed before the clusters, because §2.4 shows the broken artifact first.
  - slug: greeter-broken
    path: ch01_mental_model/greeter_broken.py
    tier: minibuild
    mode: compile
    chapter: 1

  # greeter-fixed is registered so CI compiles it, and never transcluded: the
  # fixed Mini-Build is presented as a diff. See the note on registry-fixed.
  - slug: greeter-fixed
    path: ch01_mental_model/greeter_fixed.py
    tier: minibuild
    mode: compile
    chapter: 1

