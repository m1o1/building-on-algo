  # -- Chapter 1, cluster 2: From a Python File to a Call You Can Make -------
  # All four are client-side programs, so all four are `script`: they are
  # byte-compiled rather than fed to puyapy, because nothing here runs on the
  # AVM. Three of them import a generated client that does not exist in this
  # repository, which is exactly why `script` stops at byte-compilation.
  - slug: compile-output
    path: ch01_mental_model/compile_output.py
    tier: core
    mode: script
    chapter: 1

  - slug: algorand-client
    path: ch01_mental_model/algorand_client.py
    tier: core
    mode: script
    chapter: 1

  - slug: typed-client
