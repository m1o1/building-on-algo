[project]
name = "building-on-algo-validation"
version = "0.1.0"
description = "Validation harness for the Building on Algorand book repository"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
test = [
    "pytest",
    "algorand-python-testing",
    "py-algorand-sdk",
    "typing-extensions",
]
compile = [
    "puyapy==5.8.1",
    "algorand-python==3.5.0",
]
pdf = [
    "cairosvg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
