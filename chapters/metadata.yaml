    % baseline, and the page reads as four short blocks adrift in three voids.
    % Twenty-six pages carried a gap over 80pt, six of them more than one.
    %
    % THAT FIGURE READ 421pt HERE AND IN TWO OTHER FILES, AND IT WAS WRONG BY
    % A SUBTRACTION. Measure it: the last word on printed folio 147 has its
    % baseline at 710.2 under `\flushbottom` and at 309.3 under `\raggedbottom`,
    % so the slack relocated is 400.9pt. The arithmetic check is
    % `3 x (156.0 - 22.4) = 400.8`, where 22.4pt is the page's own natural
    % paragraph gap -- the 15.6pt baseline plus the 6pt `\parskip` -- and it is
    % measurable on the ragged build, which shows three gaps of exactly 22.4pt
    % where the three 156.0pt voids used to be. The 421 came from
    % `3 x (156.0 - 15.6)`: subtracting the *baselineskip* where the *natural
    % paragraph gap* belongs, which counts the 6pt `\parskip` as slack three
    % times over. Everything else in the demonstration reproduces exactly.
    %
