    % sits. The alternative repairs were both worse: shrinking the figure to
    % fit would take its type back under the 8pt on-page floor, and dropping
    % the `H` placement would let figures drift pages away from the sentence
    % that introduces them, which is the thing `\floatplacement` above exists
    % to prevent.
    \raggedbottom
