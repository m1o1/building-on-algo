    %
    % Slack at the foot of a page collects at the foot, rather than being
    % pushed up between the paragraphs. `report.cls` runs `\raggedbottom` only
    % when `twoside` is off (`report.cls:731-733`), and this book is twoside,
    % so the class default here is `\flushbottom` -- and `\flushbottom` has to
    % put a short page's missing height somewhere. It puts it in whatever glue
    % on the page can stretch, which in a page of ordinary prose is pandoc's
