    % discretionary break, so a global setting also forbids the twenty-one
    % ordinary hyphenated prose page-ends this book had -- which are correct
    % typography, not defects -- and the pressure of forbidding them has to go
    % somewhere. It went into two GOTCHA callouts reduced to a bare header bar
